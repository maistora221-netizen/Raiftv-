
name: Build RaifTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip RaifTV_AndroidTV_v1_source.zip

      - name: Build APK
        run: gradle -p RaifTV_AndroidTV assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RaifTV-APK
          path: RaifTV_AndroidTV/app/build/outputs/apk/debug/app-debug.apk
